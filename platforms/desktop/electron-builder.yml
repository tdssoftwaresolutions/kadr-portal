appId: live.kadr.portal
productName: Kadr Portal
copyright: Copyright © Kadr

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - platforms/desktop/**
  - backend/lib/**
  - backend/routes/**
  - backend/controller/**
  - backend/services/**
  - backend/middleware/**
  - backend/config/**
  - backend/utils/**
  - backend/server.js
  - backend/blog.sample
  - db/prisma/**
  - package.json
  - node_modules/.prisma/**/*
  - node_modules/@prisma/**/*
  - "!frontend/**"
  - "!public/**"
  - "!**/*.md"
  - "!**/.env*"

asarUnpack:
  - node_modules/.prisma/**/*
  - node_modules/@prisma/**/*
  - node_modules/puppeteer/**

mac:
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip

dmg:
  title: Kadr Portal

extraResources:
  - from: config/env/.env.desktop.example
    to: .env.example

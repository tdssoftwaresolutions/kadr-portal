# Compression + cache policy for the built admin SPA (dist/) served by nginx.
#
# nginx serves /admin/* straight from disk, so Express's compression() and
# Cache-Control headers (backend/lib/serverApp.js) never apply. Without this,
# every JS/CSS file goes out uncompressed (~5x larger) with no cache policy,
# so each first visit to a page re-downloads its chunk.
#
# 1. Include this file inside the `http { ... }` block (NOT inside `server`,
#    because `map` is only allowed at http level):
#
#      http {
#        ...
#        include /path/to/deploy/nginx/kadr-admin-static.conf;
#        server { ... }
#      }
#
# 2. In the `server` block, add the header to the existing /admin/ location
#    and block source maps (works with either `root` or `alias`):
#
#      location ~ ^/admin/.*\.map$ {
#        return 404;
#      }
#      location /admin/ {
#        alias /path/to/dist/;
#        try_files $uri $uri/ /admin/index.html;
#        add_header Cache-Control $kadr_admin_cache_control;
#      }
#
# 3. sudo nginx -t && sudo nginx -s reload   (Homebrew: nginx -t && nginx -s reload)

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  application/javascript
  application/json
  image/svg+xml
  font/ttf
  application/vnd.ms-fontobject;

# js/, css/ and fonts/ hold content-hashed files (index.3f2a1b9c.js ...): the
# name changes whenever the content does, so they can be cached forever. Only
# safe with the production build (`npm run build`). Everything else under
# /admin/ — index.html (the SPA fallback), favicons in img/icons, the service
# worker — must be revalidated so a deploy is picked up immediately.
# An empty value means nginx sends no Cache-Control header at all.
map $uri $kadr_admin_cache_control {
  default                    "";
  ~^/admin/(js|css|fonts)/   "public, max-age=31536000, immutable";
  ~^/admin/                  "no-cache";
}
